# A release for each version tag. The version's commit message carries the notes: its
# first line is the title ("ClaudeBand vX.Y.Z"), the rest the body. Attached: the plugin
# itself as ClaudeBand-vX.Y.Z.zip, a ClaudeBand/ folder ready to load.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Package the plugin
        env:
          TAG: ${{ github.ref_name }}
        run: git archive --format=zip --prefix=ClaudeBand/ -o "ClaudeBand-$TAG.zip" HEAD .claude-plugin hooks types README.md README.en.md LICENSE
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          git log -1 --format=%b > notes.md
          gh release create "$TAG" --verify-tag --title "$(git log -1 --format=%s)" --notes-file notes.md "ClaudeBand-$TAG.zip"
