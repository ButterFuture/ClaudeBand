<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="ClaudeBand">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e2876a"/>
      <stop offset="1" stop-color="#c15f3c"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="30" fill="url(#bg)"/>
  <!-- the clock: a ring three-quarters full, the pace tick past it -->
  <circle cx="64" cy="56" r="29" fill="none" stroke="#fff" stroke-opacity="0.28" stroke-width="11"/>
  <circle cx="64" cy="56" r="29" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round"
          stroke-dasharray="127.5 182.2" transform="rotate(-90 64 56)"/>
  <line x1="64" y1="21" x2="64" y2="34" stroke="#3b1d12" stroke-opacity="0.55" stroke-width="6" stroke-linecap="round" transform="rotate(300 64 56)"/>
  <line x1="64" y1="21" x2="64" y2="34" stroke="#fff" stroke-width="2.6" stroke-linecap="round" transform="rotate(300 64 56)"/>
  <!-- the band it lives in -->
  <rect x="26" y="99" width="76" height="9" rx="4.5" fill="#fff" fill-opacity="0.28"/>
  <rect x="26" y="99" width="48" height="9" rx="4.5" fill="#fff"/>
</svg>
